spring:
  application:
    name: global-config
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
      direct:
        observation-enabled: true

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # 100% tracing (DEV only)
    propagation:
      type: w3c
#    propagation:
#      consume: [ b3, w3c ]
#      produce: [ b3, w3c ]
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    enabled: true

